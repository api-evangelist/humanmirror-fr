  name: HumanMirror x402 API
  description: 'HumanMirror x402 API v3.2.0: 82 pay-per-call operations settled in USDC on Base through x402 V2
    — agent security (secret scanning, safe preflight, execution receipts, sanitize shield), data quality (clean/dedupe/normalize/anomaly),
    ~35 ''Automata'' operational guards, canonical 5 USDC bundles, the 297 USDC / 30-day Enterprise Fleet pass,
    the free Zero-Cost Sink and micro-work routes, and the credentialed Next-Gen preview (intent proof, fleet consensus
    lock, escrow settle, Agent OS state & trust). Every paid route answers 402 + PAYMENT-REQUIRED first.'
