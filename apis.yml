- aid: humanmirror-fr:m2m-core
  name: HumanMirror M2M Core Services
  description: 'Three separately published contracts for the M2M core: Sanitize Shield (indirect prompt-injection
    quarantine with a signed Cleanliness Proof), M2M Payload Normalizer (canonical JSON + stable SHA-256 digest)
    and the Probabilistic Consensus Oracle (weighted log-odds validation of two contradictory agent signals). Each
    has a free discovery GET, three free calls per 24 hours, then 0.001 USDC via x402; all three are also inside
    the x402 contract.'
