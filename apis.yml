aid: humanmirror-fr

name: HumanMirror

description: 'HumanMirror is a Toulouse, France-based agent-infrastructure provider (operated as an entrepreneur
  individuel) that sells security, verification, data-quality and payment-orchestration services to autonomous agents
  and the developers who run them. Agents pay per call in USDC on Base through x402 V2 (0.001 / 0.010 / 0.050 USDC
  tiers, 5 USDC bundles, a 297 USDC 30-day pass) or in Stripe-bought credits (Oracle, Forge, Nexus); humans buy
  audits, a Pro subscription and Enterprise Guard governance tiers in EUR. The surface is unusually machine-first:
  16 OpenAPI 3.1 contracts, seven hosted MCP servers whose tools/list is open, an A2A agent card, llms.txt, an ai-plugin
  manifest, published JSON Schemas and ~40 vendor /.well-known/ manifests, all on a single host.'

url: https://raw.githubusercontent.com/api-evangelist/humanmirror-fr/refs/heads/main/apis.yml

