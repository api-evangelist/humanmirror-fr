- name: Enterprise Guard key
  header: 'Authorization: Bearer hm_guard_…'
  products:
  - Enterprise Guard preflight (/api/v1/enterprise-guard/preflight/)
  how_to_get: Enterprise Guard subscription (1 500 / 3 000 / 5 000 EUR per month)
  spec_schemes: []
  note: documented on /enterprise-guard/ only; no OpenAPI
- name: HumanMirror Pro key
  header: 'X-API-Key: <key> (README example prefix hm_live_)'
  products:
  - Pro SaaS (/api/v1/saas/*)
  - Next-Gen preview routes (/v1/agent/intent-proof/, /v1/fleet/consensus-lock/, /v1/m2m/escrow-settle/, /v1/agent/state-and-trust/)
    subject to the Pro monthly quota
  how_to_get: HumanMirror Pro subscription, 49 EUR/month (https://humanmirror.fr/dashboard/)
  spec_schemes:
  - HumanMirrorProApiKey
- name: Enterprise Fleet pass
  header: 'Authorization: Bearer <hmep1 token>'
  products:
  - Unlimited Payload Normalizer + Consensus Oracle + Sanitize Shield for 30 days; Next-Gen preview included; referral
    routes
  how_to_get: POST https://humanmirror.fr/api/x402/enterprise-pass/ paying 297 USDC via x402
  spec_schemes:
  - EnterpriseBearer
- name: Genesis allocation token
  header: 'Authorization: Bearer <GENESIS_ALLOCATION_TOKEN>'
  products:
  - POST /api/v1/m2m/resource/ (20 context_compress calls / 48h)
  how_to_get: POST /api/v1/m2m/handshake/ then POST /api/v1/m2m/claim-resource/ (skill.md)
  spec_schemes: []
- name: x402 payment signature
  header: 'PAYMENT-SIGNATURE: <EIP-3009 authorization for the exact USDC amount>'
  products:
  - every /api/x402/* route, /api/v1/m2m/*, /api/v1/consensus/verify/, /api/v1/sanitize/shield/, /api/v1/zero/,
    /api/market/intent|award, /v1/agent/perception-vector/, Agent OS state-and-trust
  how_to_get: Call without it, read the PAYMENT-REQUIRED header on the 402 (x402Version 2, accepts[] amount/payTo/network
    eip155:8453/asset USDC), sign, retry
  observed: '2026-09-19: POST /api/x402/secret-scanning/ -> 402 ''PAYMENT-SIGNATURE header is required'''
  spec_schemes: []
  note: Declared as a header parameter on 68 operations rather than as a securityScheme.
