docs: null
summary:
  types:
  - http bearer (per-product prefixed API keys)
  - apiKey in header (X-API-Key, HumanMirror Pro)
  - x402 payment signature (PAYMENT-SIGNATURE header, not an OpenAPI securityScheme)
  - none (discovery, quotes, verification, Magnet, MCP tools/list)
  oauth2: false
  oidc: false
  mtls: false
  note: 'No OAuth anywhere: /.well-known/oauth-authorization-server, oauth-protected-resource and openid-configuration
    all 404. Identity is a bearer key whose PREFIX names the product that issued it, and on pay-per-call routes
    the credential is the payment itself.'
credential_classes:
