openapi: 3.2.0
info:
  title: HumanMirror AgentOps Vault API
  version: 1.0.0
  description: Deterministic operational utilities for AI-agent workflows. Authentication uses a HumanMirror Nexus API key.
servers:
- url: https://humanmirror.fr
tags:
- name: Vault
paths:
  /api/vault/scan:
    post:
      summary: Scan for likely secret leakage
      security:
      - NexusBearer: []
      responses:
        '200':
          description: Redacted secret scan
      tags:
      - Vault
      operationId: postApiVaultScan
      x-operation-id-source: derived
components:
  securitySchemes:
    NexusBearer:
      type: http
      scheme: bearer
      bearerFormat: hm_nexus_*
