openapi: 3.2.0
info:
  title: HumanMirror AgentOps Lens API
  version: 1.0.0
  description: Deterministic operational utilities for AI-agent workflows. Authentication uses a HumanMirror Nexus API key.
servers:
- url: https://humanmirror.fr
tags:
- name: Lens
paths:
  /api/lens/infer:
    post:
      summary: Infer a JSON contract
      security:
      - NexusBearer: []
      responses:
        '200':
          description: Inferred contract
      tags:
      - Lens
      operationId: postApiLensInfer
      x-operation-id-source: derived
  /api/lens/diff:
    post:
      summary: Detect breaking JSON contract changes
      security:
      - NexusBearer: []
      responses:
        '200':
          description: Contract diff
      tags:
      - Lens
      operationId: postApiLensDiff
      x-operation-id-source: derived
components:
  securitySchemes:
    NexusBearer:
      type: http
      scheme: bearer
      bearerFormat: hm_nexus_*
