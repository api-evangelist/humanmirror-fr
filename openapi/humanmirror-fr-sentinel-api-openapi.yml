openapi: 3.2.0
info:
  title: HumanMirror AgentOps Sentinel API
  version: 1.0.0
  description: Deterministic operational utilities for AI-agent workflows. Authentication uses a HumanMirror Nexus API key.
servers:
- url: https://humanmirror.fr
tags:
- name: Sentinel
paths:
  /api/sentinel/inspect:
    post:
      summary: Inspect AI output hygiene
      security:
      - NexusBearer: []
      responses:
        '200':
          description: Sentinel quality report
        '401':
          description: Invalid Nexus key
        '402':
          description: Insufficient credits
      tags:
      - Sentinel
      operationId: postApiSentinelInspect
      x-operation-id-source: derived
components:
  securitySchemes:
    NexusBearer:
      type: http
      scheme: bearer
      bearerFormat: hm_nexus_*
