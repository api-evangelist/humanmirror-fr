openapi: 3.2.0
info:
  title: HumanMirror X402 API
  version: 3.2.0
  description: 'HumanMirror Agent-First machine-payment API: M2M infrastructure on Base using x402 V2 and USDC, autonomous agent security, prompt injection defense, AI micro-transactions and non-custodial escrow preview. Granular calls use 0.001 / 0.010 / 0.050 USDC, thematic bundles 5.000 USDC, Enterprise Fleet 297.000 USDC / 30 days, plus the 2027-2030 Next-Gen preview suite at 0.050 USDC per test call.'
  x-keywords:
  - M2M infrastructure on Base
  - x402 payment protocol
  - Autonomous agent security
  - Prompt injection defense
  - AI micro-transactions and escrow
  - Intent-Proof
  - M2M Escrow
  - Consensus-Lock
servers:
- url: https://humanmirror.fr
tags:
- name: X402
paths:
  /api/x402/outcome/:
    post:
      operationId: humanmirrorX402Outcome
      summary: Buy one deterministic verified outcome
      description: 'Granular unit route at 0.010 USDC on Base mainnet. Upgrade path: https://humanmirror.fr/api/v1/agent/verification/'
      parameters:
      - name: PAYMENT-SIGNATURE
        in: header
        required: false
        schema:
          type: string
        description: x402 V2 signed payment payload. Omit on first request to receive payment requirements.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome_type:
                  type: string
                  enum:
                  - clean_json
                  - deduplicate_records
                  - normalize_entity
                  - data_quality_at_least
                  - detect_anomalies
                  - no_secrets
                  - output_quality
                  - schema_compatible
                  - safe_preflight
                  - execution_receipt
                objective:
                  type: string
                input: {}
                criteria:
                  type: object
                options:
                  type: object
              required:
              - input
      responses:
        '200':
          description: Verified result after successful x402 settlement
        '402':
          description: Payment required; inspect PAYMENT-REQUIRED header
        '422':
          description: Execution or deterministic verification failed; payment is not settled
        '503':
          description: Facilitator or settlement unavailable
      deprecated: false
      x-humanmirror-canonical-bundle: https://humanmirror.fr/api/v1/agent/verification/
      x-humanmirror-price-usdc: '0.010'
      x-humanmirror-pricing-tier: granular_unit_0_010
      tags:
      - X402
  /api/x402/one/:
