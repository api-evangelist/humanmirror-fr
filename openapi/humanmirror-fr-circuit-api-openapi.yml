openapi: 3.2.0
info:
  title: HumanMirror AgentOps Circuit API
  version: 1.0.0
  description: Deterministic operational utilities for AI-agent workflows. Authentication uses a HumanMirror Nexus API key.
servers:
- url: https://humanmirror.fr
tags:
- name: Circuit
paths:
  /api/circuit/preflight:
    post:
      summary: Preflight operational risk in a proposed action
      security:
      - NexusBearer: []
      responses:
        '200':
          description: Risk preflight
      tags:
      - Circuit
      operationId: postApiCircuitPreflight
      x-operation-id-source: derived
components:
  securitySchemes:
    NexusBearer:
      type: http
      scheme: bearer
      bearerFormat: hm_nexus_*
