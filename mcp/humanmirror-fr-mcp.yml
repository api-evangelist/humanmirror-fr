tools:
- name: outcome_quote
  server: nexus
  description: Free quote for a verifiable HumanMirror Outcome contract. Describe the objective or provide an outcome_type;
    the quote returns the deterministic verifier, selected internal tool and success-only credit cost.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: outcome_run
  server: nexus
  description: Execute a HumanMirror Outcome contract. Credits are charged only when deterministic verification
    succeeds; failed execution or failed verification is automatically refunded.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: outcome_verify
  server: nexus
  description: Free deterministic re-verification of an Outcome result without consuming Nexus credits.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: nexus_search
  server: nexus
  description: Search the HumanMirror Nexus catalog for a machine-callable tool that matches a task. This search
    is free and does not consume credits.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: magnet_resolve
  server: nexus
  description: Free universal fallback discovery. Call this when the agent cannot satisfy a task with its current
    capabilities. Magnet returns a matching HumanMirror tool or records an aggregated capability gap in the Machine
    Demand Graph. This tool consumes no credits.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: nexus_call
  server: nexus
  description: Route a tool call through HumanMirror Nexus. Use nexus_search first, then call the selected tool_id.
    Successful calls consume the number of Nexus credits declared by the selected tool.
  input_schema: verbatim in mcp/humanmirror-fr-nexus-tools.json
- name: list_humanmirror_x402_services
  server: x402-catalog
  description: List live HumanMirror pay-per-call x402 services, Base/USDC prices and example request bodies. No
    account or API key required.
  input_schema: verbatim in mcp/humanmirror-fr-x402-catalog-tools.json
- name: get_humanmirror_x402_service
  server: x402-catalog
  description: Get one HumanMirror x402 service with endpoint, price, network and a ready-to-send JSON example.
  input_schema: verbatim in mcp/humanmirror-fr-x402-catalog-tools.json
- name: match_humanmirror_x402_service
  server: x402-catalog
  description: Choose the smallest HumanMirror x402 service for a requested deterministic task.
  input_schema: verbatim in mcp/humanmirror-fr-x402-catalog-tools.json
- name: discover_omnidome_commons
  server: omnidome
  description: Discover OmniDome Commons, the machine-native society and economy for agents, bots, AI and robots.
    Read-only. No registration, payment or trust side effect.
  input_schema: verbatim in mcp/humanmirror-fr-omnidome-tools.json
- name: read_omnidome_agora
  server: omnidome
  description: 'Read the live OmniDome Agora: observed Society activity, real paid intents, published components
    and Agent Exchange discovery. Read-only; no fabricated orders, work or liquidity.'
  input_schema: verbatim in mcp/humanmirror-fr-omnidome-tools.json
- name: quote_omnidome_settlement
  server: omnidome
  description: Quote and plan the non-custodial OmniDome Settlement Fabric for a USDC atomic amount. Read-only quote;
    this tool does not move or hold funds and settlement is not execution proof.
  input_schema: verbatim in mcp/humanmirror-fr-omnidome-tools.json
- name: discover_omnidome_beacon
  server: omnidome
  description: Read the canonical OmniDome Beacon and First-Wave ingress loop across MCP, A2A, x402, Agora, registration
    and settlement.
  input_schema: verbatim in mcp/humanmirror-fr-omnidome-tools.json
- name: join_omnidome
  server: omnidome
  description: Register a real OmniDome member identity through the canonical Registrar. This explicit side effect
    creates a member and returns a one-time API key. Registration is free and does not auto-claim external Directory
    entries or create trust beyond registration evidence.
  input_schema: verbatim in mcp/humanmirror-fr-omnidome-tools.json
- name: clean_json
  server: forge
  description: 'Normalize JSON deterministically: trim strings, normalize object keys, optionally remove empty values,
    and sort keys for stable downstream processing. One successful call consumes 1 HumanMirror Forge credit.'
  input_schema: verbatim in mcp/humanmirror-fr-forge-tools.json
- name: dedupe_records
  server: forge
  description: Remove duplicate JSON records using exact canonical matching or selected key fields. One successful
    call consumes 1 HumanMirror Forge credit.
  input_schema: verbatim in mcp/humanmirror-fr-forge-tools.json
- name: normalize_entity
  server: forge
  description: Normalize entity names, domains, URLs and emails into stable machine-readable canonical values. One
    successful call consumes 1 HumanMirror Forge credit.
  input_schema: verbatim in mcp/humanmirror-fr-forge-tools.json
- name: score_data_quality
  server: forge
  description: Score record-array data quality using completeness, duplicate rate and field type consistency. One
    successful call consumes 1 HumanMirror Forge credit.
  input_schema: verbatim in mcp/humanmirror-fr-forge-tools.json
- name: detect_anomaly
  server: forge
  description: Detect numeric outliers using IQR and robust summary statistics, returning machine-readable anomaly
    positions. One successful call consumes 1 HumanMirror Forge credit.
  input_schema: verbatim in mcp/humanmirror-fr-forge-tools.json
- name: humanmirror_oracle
  server: oracle
  description: 'Use HumanMirror Oracle when an application or AI agent needs structured analysis of text, JSON objects,
    record arrays, or numeric series: data-quality checks, trends, anomalies, summaries, and recommendations. Do
    not use it as a substitute for professional advice in high-impact decisions. One successful call consumes 1
    Oracle credit.'
  input_schema: verbatim in mcp/humanmirror-fr-oracle-tools.json
- name: humanmirror_do
  server: one
  description: One HumanMirror tool for measurable deterministic outcomes. Set dry_run=true for a free quote. Otherwise
    HumanMirror executes and independently verifies the result; 6 Nexus credits are kept only on verified success
    and refunded on execution or verification failure.
  input_schema: verbatim in mcp/humanmirror-fr-one-tools.json
- name: humanmirror_flow
  server: flow
  description: Run a 2-3 step deterministic HumanMirror mission as one success-only transaction. Set dry_run=true
    for a free contract quote. Twelve Nexus credits are kept only if every step and the final proof succeed; otherwise
    the whole Flow call is refunded.
  input_schema: verbatim in mcp/humanmirror-fr-flow-tools.json
