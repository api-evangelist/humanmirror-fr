summary: HumanMirror ships SEVEN first-party hosted (remote, streamable-http) MCP servers on humanmirror.fr, all
  of which answered `initialize` and `tools/list` anonymously on 2026-09-19 — 22 tools in total, every inputSchema
  saved verbatim under mcp/. Discovery is free on every server; execution tools bill Nexus/Forge/Oracle credits
  (Stripe packs) or x402 USDC. Four servers are published in the official MCP registry under the fr.humanmirror/*
  namespace.
deployment:
  mode: remote
  endpoint: https://humanmirror.fr/api/nexus/mcp/
  install: null
